<script>

   Bu dosya yalnız tasarım değiştiğinde güncellenir.
*/
const SB = "https://wlfabfpjvqfyvhsvldll.supabase.co";
const KEY = "sb_publishable_eUv7jsfqkFFbn7k7l-KfAw_WhLiK3PB";
const H = { apikey: KEY, Authorization: "Bearer " + KEY };
const q = (path) => fetch(SB + "/rest/v1/" + path, { headers: H }).then(r => r.json());
const app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const AY = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const gun = (d) => { const x = new Date(d); return x.getDate() + " " + AY[x.getMonth()]; };
const tarihAralik = (a, b) => { const x = new Date(a), y = new Date(b); return (x.getMonth() === y.getMonth() ? x.getDate() + "–" + y.getDate() + " " + AY[y.getMonth()] : gun(a) + " – " + gun(b)) + " " + y.getFullYear(); };
const para = (n, p) => Number(n).toLocaleString("tr-TR", { maximumFractionDigits: 0 }) + " " + ({EUR:"€",USD:"$",TRY:"₺",SAR:"SAR"}[p] || p);

async function liste() {
  const turlar = await q("v_site_turlar?select=*&order=baslangic.asc");
  document.title = "Plusiva Travel · Turlar";
  if (!turlar.length) { app.innerHTML = '<div class="empty">Şu anda satışta tur yok. WhatsApp\'tan yazın, size özel planlayalım.</div>'; return; }
  app.innerHTML = `<section><div class="eyebrow">Satıştaki turlar</div><h1 style="font-size:clamp(32px,4.5vw,48px);margin-top:8px">Türkçe rehberli, aileye uygun yurt dışı turları</h1></section>
  <div class="tours">${turlar.map(t => `
    <a class="card tour" href="${window.PV_KOK||""}tur/${esc(t.kod)}/">
      <div class="eyebrow">${esc(tarihAralik(t.baslangic, t.bitis))} · ${esc(t.kalkis_sehri||"")}</div>
      <h3>${esc(t.ad)}</h3>
      <div class="m">${esc(t.slogan||"")}</div>
      <div class="p">${para(Number(t.satis_fiyati)+Number(t.zorunlu_paket_fiyati||0), t.para_birimi)} <small style="font-family:Manrope;font-size:13px;color:var(--ink2)">kişi başı</small></div>
      <div class="m">${t.gun_sayisi} gün / ${t.gece_sayisi} gece${t.durum==="dolu"?" · <b>Kontenjan doldu</b>":""}</div>
    </a>`).join("")}</div>`;
}

async function detay(kod) {
  const tl = await q(`v_site_turlar?select=*&kod=eq.${encodeURIComponent(kod)}`);
  const t = Array.isArray(tl) && tl[0];
  if (!t) { app.innerHTML = '<div class="empty">Bu tur şu anda satışta değil. <a href="${window.PV_KOK||"./"}">Diğer turlara bakın</a>.</div>'; return; }
  const [prog, fk] = await Promise.all([
    q(`tur_programi?select=gun_no,tarih,sehir,baslik,aciklama,blok_tipi&order=gun_no.asc,sira.asc&tur_id=eq.${t.id}`),
    q(`fiyat_kurallari?select=kural_tipi,aciklama,deger,deger_tipi,para_birimi&tur_id=eq.${t.id}`)
  ]);
  const toplam = Number(t.satis_fiyati) + Number(t.zorunlu_paket_fiyati || 0);
  const oz = t.ozellikler || {};
  const kural = (tip) => fk.find(k => k.kural_tipi === tip);
  const sngl = kural("sngl_farki"), trpl = kural("trpl_indirimi"), cocuk = kural("cocuk_indirimi"), bebek = kural("bebek_fiyati");
  const sehirler = (oz.sehirler || []);
  document.title = `${t.ad} · ${tarihAralik(t.baslangic, t.bitis)} · Plusiva Travel`;
  app.innerHTML = `
  <section class="hero">
    <div>
      <div class="eyebrow">${esc(tarihAralik(t.baslangic, t.bitis))}${t.kalkis_sehri ? " · " + esc(t.kalkis_sehri) + " kalkışlı" : ""}</div>
      <h1>${esc(t.slogan || t.ad)}</h1>
      <p class="lead">${esc(t.aciklama || "")}</p>
      ${sehirler.length ? `<div class="route">${sehirler.map(s => `<span>${esc(s)}</span>`).join("")}</div>` : ""}
      <div class="cta-row"><a class="btn" href="#kayit">Ön kayıt yaptır</a><a class="btn ghost" href="#program">Programı incele</a></div>
    </div>
    <div class="card price">
      <div class="lbl">Kişi başı · iki kişilik odada</div>
      <div class="big">${para(t.satis_fiyati, t.para_birimi)}${Number(t.zorunlu_paket_fiyati) ? ` <small>+ ${para(t.zorunlu_paket_fiyati, t.para_birimi)} paket</small>` : ""}</div>
      <div class="sub">Toplam ${para(toplam, t.para_birimi)} · Taksit imkânı · Ön kayıtla yer garanti</div>
      ${(oz.kisa_bilgi||[]).length ? `<div class="facts">${oz.kisa_bilgi.map(([b,d]) => `<div><b>${esc(b)}</b>${esc(d)}</div>`).join("")}</div>` : ""}
    </div>
  </section>
  ${(t.one_cikanlar||[]).length ? `<section><h2>Neden bu tur</h2><div class="why">${t.one_cikanlar.map(o => `<div class="card"><h3>${esc(o.baslik)}</h3><p>${esc(o.metin)}</p></div>`).join("")}</div></section>` : ""}
  ${prog.length ? `<section id="program"><h2>Gün gün program</h2><div class="days">${prog.map(p => `
    <div class="day"><div class="n">${p.tarih ? esc(gun(p.tarih)) : ""}<b>${p.gun_no}. Gün</b></div><div><h3>${esc(p.baslik || p.sehir || "")}</h3><p>${esc(p.aciklama || "")}</p></div></div>`).join("")}</div></section>` : ""}
  <section><div class="two">
    <div><h2>Fiyata dahil</h2><ul class="list">${(t.dahil_olanlar||[]).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
    <div><h2>Dahil değil</h2><ul class="list no">${(t.haric_olanlar||[]).map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      ${Number(t.zorunlu_paket_fiyati) ? `<div class="gold-box" style="margin-top:14px"><b>${para(t.zorunlu_paket_fiyati, t.para_birimi)} zorunlu paket:</b> ${esc(t.zorunlu_paket_aciklama || "")} ${esc(oz.anit_notu || "")}</div>` : ""}
    </div>
  </div></section>
  <section><h2>Oda ve yaş seçenekleri</h2><div class="prices">
    <div class="card"><div class="t">İki kişilik oda</div><div class="v">${para(toplam, t.para_birimi)}</div><div class="d">kişi başı${Number(t.zorunlu_paket_fiyati) ? ", paket dahil" : ""}</div></div>
    ${sngl ? `<div class="card"><div class="t">Tek kişilik oda</div><div class="v">+${para(sngl.deger, sngl.para_birimi)}</div><div class="d">${esc(sngl.aciklama||"")}</div></div>` : ""}
    ${trpl ? `<div class="card"><div class="t">Üç kişilik oda</div><div class="v">−${para(trpl.deger, trpl.para_birimi)}</div><div class="d">${esc(trpl.aciklama||"")}</div></div>` : ""}
    ${cocuk ? `<div class="card"><div class="t">Çocuk 7–12 yaş</div><div class="v">−${para(cocuk.deger, cocuk.para_birimi)}</div><div class="d">iki yetişkinle aynı odada${bebek ? " · 0–2 yaş " + para(bebek.deger, bebek.para_birimi) : ""}</div></div>` : ""}

    <div><h2>Ön kayıt</h2><p class="sub">Formu doldurun, aynı gün Cevahir Kılıç sizi arasın ya da WhatsApp'tan yazsın. Ön kayıt ücretsizdir, yer ayırtmak için depozito daha sonra istenir.</p>
      ${oz.kayit_notu ? `<div class="gold-box">${esc(oz.kayit_notu)}</div>` : ""}</div>

      <div class="grid2"><div><label for="ad">Ad</label><input id="ad" name="ad" required autocomplete="given-name"></div><div><label for="soyad">Soyad</label><input id="soyad" name="soyad" autocomplete="family-name"></div></div>
      <div class="grid2"><div><label for="telefon">Telefon (WhatsApp)</label><input id="telefon" name="telefon" type="tel" required placeholder="05xx xxx xx xx" autocomplete="tel"></div><div><label for="eposta">E-posta</label><input id="eposta" name="eposta" type="email" autocomplete="email"></div></div>
      <div class="grid2"><div><label for="kisi">Kişi sayısı</label><select id="kisi" name="kisi_sayisi"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>8</option><option>10</option><option value="15">10+</option></select></div>
      <div><label for="oda">Oda tercihi</label><select id="oda" name="oda_tercihi"><option value="DBL">İki kişilik</option><option value="SNGL">Tek kişilik</option><option value="TRPL">Üç kişilik</option><option value="AILE">Aile (çocuklu)</option></select></div></div>
      <label for="mesaj">Not (isteğe bağlı)</label><textarea id="mesaj" name="mesaj" placeholder="Vize durumu, özel istek, grup bilgisi..."></textarea>
      <div class="hp" aria-hidden="true"><label for="web_site">Web siteniz</label><input id="web_site" name="web_site" tabindex="-1" autocomplete="off"></div>
      <input type="hidden" name="tur_kodu" value="${esc(t.kod)}"><input type="hidden" name="kaynak" value="site">
      <div style="margin-top:16px"><button class="btn" type="submit" id="gonder">Ön kaydı gönder</button></div>
      <p class="note">Bilgileriniz yalnızca bu tur için kullanılır, üçüncü kişiyle paylaşılmaz.</p>
      <div id="sonuc" hidden></div>
    </form>
  </div></section>`;
  const st = document.getElementById("sticky");
  st.hidden = false; st.innerHTML = `<div><b>${para(toplam, t.para_birimi)}</b> <span style="color:var(--ink2);font-size:13px">kişi başı</span></div><a class="btn" href="#kayit">Ön kayıt</a>`;
  formBagla();
}

function formBagla() {
  const f = document.getElementById("f"), btn = document.getElementById("gonder"), out = document.getElementById("sonuc");
  f.addEventListener("submit", async (e) => {
    e.preventDefault(); out.hidden = true; out.className = "";
    const d = Object.fromEntries(new FormData(f).entries());
    if (!d.ad.trim() || !d.telefon.trim()) { out.className = "err"; out.textContent = "Ad ve telefon zorunlu."; out.hidden = false; return; }
    btn.disabled = true; btn.textContent = "Gönderiliyor…";
    try {
      const r = await fetch(SB + "/functions/v1/rezervasyon-talebi", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) });
      const j = await r.json();
      if (r.ok && j.tamam) { out.className = "ok"; out.innerHTML = "Ön kaydınız alındı. Dosya numaranız <b>" + esc(j.dosya_no || "") + "</b>. En kısa sürede size dönüyoruz."; f.reset(); }
      else { out.className = "err"; out.textContent = j.hata || "Gönderilemedi, lütfen WhatsApp'tan yazın."; }
    } catch { out.className = "err"; out.textContent = "Bağlantı kurulamadı. Lütfen WhatsApp'tan yazın: +90 533 435 68 24"; }
    out.hidden = false; btn.disabled = false; btn.textContent = "Ön kaydı gönder";
  });
}

const kod = window.PV_KOD || new URLSearchParams(location.search).get("tur");
(kod ? detay(kod) : liste()).catch(() => { app.innerHTML = '<div class="empty">Sayfa yüklenemedi. Lütfen WhatsApp\'tan yazın: +90 533 435 68 24</div>'; });
</script>
</body>
</html>
