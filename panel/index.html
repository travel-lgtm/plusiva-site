<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Plusiva Sistem</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6f3;--sur:#fff;--ink:#1a1f1d;--mut:#6f7975;--line:#e3e6e2;--acc:#0f5c5a;--acc2:#e6efee;--warn:#9a5a14;--warn2:#fff3e0;--ok:#1b5e3a;--ok2:#e8f5ec;--bad:#8a2a2a;--bad2:#fbeaea;--side:#111816}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;display:flex}
aside{width:248px;flex:none;background:var(--side);color:#cfd6d3;display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.logo{padding:18px 18px 12px;color:#fff;font-weight:800;font-size:17px;letter-spacing:.02em}.logo span{color:#8fd3c8}
.menu{overflow:auto;flex:1;padding:4px 10px 16px}
.grp{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#7d8985;padding:14px 10px 6px}
.it{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;color:#d7ddda;font-weight:600;font-size:13.5px}
.it:hover{background:#1d2622}.it.on{background:var(--acc);color:#fff}.it.soon{color:#6f7975;cursor:default}.it.soon:hover{background:none}
.it .tag{font-size:10px;font-weight:800;padding:2px 6px;border-radius:999px;background:#26312d;color:#9aa8a3}.it.on .tag{background:rgba(255,255,255,.2);color:#fff}
.side-foot{padding:12px 18px;border-top:1px solid #23302b;font-size:12px;color:#7d8985}
main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh}
.top{background:var(--sur);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:12px;min-height:52px}
.top h1{margin:0;font-size:16px;font-weight:800}.top .crumb{color:var(--mut);font-size:13px}.top .sp{flex:1}
.top select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;background:#fff}
.btn{border:1px solid var(--line);background:#fff;padding:7px 11px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.content{flex:1;min-height:0;position:relative}
iframe{width:100%;height:100%;border:0;background:#fff;display:none}iframe.on{display:block}
#home{position:absolute;inset:0;overflow:auto;padding:20px;display:none}#home.on{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--sur);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}.kpi:hover{border-color:var(--acc)}.kpi .k{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}.kpi .v{font-size:26px;font-weight:800;margin-top:4px}.kpi .s{font-size:12px;color:var(--mut)}.kpi.w .v{color:var(--warn)}.kpi.b .v{color:var(--bad)}.kpi.acc .v{color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:1000px){.grid{grid-template-columns:1fr}aside{width:200px}}
.card{background:var(--sur);border:1px solid var(--line);border-radius:14px;padding:16px}.card h2{margin:0 0 10px;font-size:15px;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:13.5px}th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:8px 6px;border-bottom:1px solid var(--line)}td{padding:8px 6px;border-bottom:1px solid #eef0ee}.num{text-align:right;white-space:nowrap}
.small{font-size:12px}.mut{color:var(--mut)}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:#eeeeea;color:var(--mut)}.pill.ok{background:var(--ok2);color:var(--ok)}.pill.w{background:var(--warn2);color:var(--warn)}.pill.b{background:var(--bad2);color:var(--bad)}
.prog{height:8px;background:#eeeeea;border-radius:999px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--acc)}
.soonbox{padding:40px;text-align:center;color:var(--mut)}
.login{max-width:400px;margin:14vh auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px}.login input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-family:inherit;margin:10px 0}
</style>
</head>
<body>
<aside>
  <div class="logo">PLUSIVA <span>Sistem</span></div>
  <nav class="menu" id="menu"></nav>
  <div class="side-foot" id="foot">Yapıcı ile kurulan sistem · Cevahir Kılıç</div>
</aside>
<main>
  <div class="top"><h1 id="baslik">Genel bakış</h1><span class="crumb" id="crumb"></span><span class="sp"></span><select id="turSel" onchange="turDegisti()"></select><button class="btn" onclick="yenile()">Yenile</button><button class="btn" onclick="PV.cikis()">Çıkış</button></div>
  <div class="content">
    <div id="home" class="on"></div>
    <iframe id="fr" name="fr"></iframe>
  </div>
</main>
<script src="oturum.js"></script>
<script>
var SB='https://wlfabfpjvqfyvhsvldll.supabase.co', KEY='sb_publishable_eUv7jsfqkFFbn7k7l-KfAw_WhLiK3PB';
var D=null, G=null, K=[], cur='home';
var MENU=[
 {grp:'Genel', items:[{id:'home',ad:'Genel bakış'}]},
 {grp:'Satış & rezervasyon', items:[{id:'dosya',ad:'Dosyalar & istisnalar',src:'islem/?embed=1&v=dosya'},{id:'onay',ad:'Onay kuyruğu',src:'islem/?embed=1&v=onay'},{id:'teklif',ad:'Teklifler',soon:1},{id:'musteri',ad:'Müşteriler',soon:1}]},
 {grp:'Ürünler & turlar', items:[{id:'paket',ad:'Ön paketler (ürünler)',src:'islem/?embed=1&v=paket'},{id:'fiyat',ad:'Fiyat konfigüratörü',src:'islem/?embed=1&v=fiyat'},{id:'vitrin',ad:'Vitrinler & site',soon:1}]},
 {grp:'Operasyon', items:[{id:'kurgu',ad:'Tur kurgusu',src:'kurgu/?embed=1'},{id:'tur',ad:'3 aşama · plan / atanan / gerçek',src:'islem/?embed=1&v=tur'},{id:'alt',ad:'Alternatifler',src:'islem/?embed=1&v=alt'},{id:'sim',ad:'Simülasyon',src:'sim/?embed=1'},{id:'kontrat',ad:'Kontratlar & adaylar',src:'kontrat/?embed=1'}]},
 {grp:'Görseller & içerik', items:[{id:'gorsel',ad:'Görsel kataloğu',src:'gorsel/?embed=1'},{id:'icerik',ad:'Tur sayfaları & yayın',soon:1}]},
 {grp:'Muhasebe & finans', items:[{id:'cari',ad:'Cari',src:'islem/?embed=1&v=cari'},{id:'odeme',ad:'Ödemeler & faturalar',soon:1},{id:'rapor',ad:'Kâr-zarar raporu',soon:1}]},
 {grp:'İletişim', items:[{id:'olay',ad:'Olaylar (mail / WhatsApp)',src:'islem/?embed=1&v=olay'},{id:'yazisma',ad:'Tedarikçi yazışmaları',soon:1}]},
 {grp:'Denetim', items:[{id:'bulgu',ad:'Bulgular',src:'islem/?embed=1&v=bulgu'}]},
 {grp:'Yönetim', items:[{id:'kullanicilar',ad:'Kullanıcılar & roller',src:'kullanicilar/?embed=1'},{id:'kurulum',ad:'Kurulum & yetenekler',src:'islem/?embed=1&v=kurulum'},{id:'ayar',ad:'Ayarlar',soon:1}]}
];
function key(){return (window.PV&&PV.token)?'oturum':(localStorage.getItem('pv_anahtar')||'');}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}
function para(n,p){if(n==null||n==='')return '—';return Number(n).toLocaleString('tr-TR',{maximumFractionDigits:0})+' '+({EUR:'€',USD:'$',TRY:'₺'}[p]||p||'');}
function tarih(d){if(!d)return '—';try{return new Date(d).toLocaleDateString('tr-TR',{day:'2-digit',month:'short'})}catch(e){return d}}
async function rpc(fn,body){var r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+((window.PV&&PV.token)||KEY)},body:JSON.stringify(body||{})});return r.json();}
async function islem(ad,veri){return rpc('panel_islem',{p_anahtar:key(),p_islem:ad,p_veri:veri||{}});}
function cur_tur(){return document.getElementById('turSel').value||null;}
function menuCiz(){
  document.getElementById('menu').innerHTML=MENU.map(function(g){return '<div class="grp">'+esc(g.grp)+'</div>'+g.items.map(function(i){return '<div class="it'+(i.id===cur?' on':'')+(i.soon?' soon':'')+'" '+(i.soon?'':'onclick="git(\''+i.id+'\')"')+'><span>'+esc(i.ad)+'</span>'+(i.soon?'<span class="tag">yakında</span>':'')+'</div>'}).join('')}).join('');
}
function bul(id){for(var g of MENU){for(var i of g.items){if(i.id===id)return i;}}return null;}
function git(id){
  var i=bul(id);if(!i||i.soon)return;cur=id;menuCiz();
  document.getElementById('baslik').textContent=i.ad;
  var fr=document.getElementById('fr'),home=document.getElementById('home');
  if(id==='home'){fr.classList.remove('on');home.classList.add('on');homeCiz();}
  else{home.classList.remove('on');fr.classList.add('on');var src=i.src+(cur_tur()?'&tur='+cur_tur():'');if(fr.getAttribute('data-src')!==src){fr.src=src;fr.setAttribute('data-src',src);}}
  try{history.replaceState(null,'','#'+id);}catch(e){}
}
function turDegisti(){var fr=document.getElementById('fr');fr.removeAttribute('data-src');if(cur!=='home')git(cur);else homeCiz();}
async function yenile(){D=await rpc('panel_veri',{p_anahtar:key(),p_tur_id:cur_tur()});G=await islem('gorsel_ozet');K=await islem('kontratlar');if(cur==='home')homeCiz();else{var fr=document.getElementById('fr');fr.removeAttribute('data-src');git(cur);}}
async function load(){
  D=await rpc('panel_veri',{p_anahtar:key(),p_tur_id:null});
  if(!D||D.hata){document.body.innerHTML='<div class="login"><b>Giriş gerekli</b><p class="small mut">Bu hesap panele yetkili değil ya da oturum yok.</p><button class="btn" onclick="PV.cikis()">Çıkış</button></div>';return;}
  var sel=document.getElementById('turSel');sel.innerHTML=(D.turlar||[]).map(function(t){return '<option value="'+t.id+'">'+esc(t.kod+' · '+t.ad)+'</option>'}).join('');if(D.tur)sel.value=D.tur.id;
  G=await islem('gorsel_ozet');K=await islem('kontratlar');
  document.getElementById('foot').innerHTML=(PV.ben&&PV.ben.eposta?'<b style="color:#cfd6d3">'+esc(PV.ben.ad||PV.ben.eposta)+'</b> · '+esc(PV.ben.rol)+'<br>':'')+'Yapıcı ile kurulan sistem · Cevahir Kılıç';
  var h=(location.hash||'#home').slice(1);menuCiz();git(bul(h)&&!bul(h).soon?h:'home');
}
function homeCiz(){
  var o=D.ozet||{},t=D.tur||{},pb=t.para_birimi||'EUR';
  var gorev=(D.gorevler||[]).slice(0,8),dosyalar=(D.dosyalar||[]).slice(0,8),bulgular=(D.bulgular||[]).slice(0,6),yayin=(D.yayinlar||[])[0];
  var kur=(D.kurulum||[]);var kurBitti=o.kurulum_bitti||0,kurTop=o.kurulum_toplam||1;
  var soon=[];MENU.forEach(function(g){g.items.forEach(function(i){if(i.soon)soon.push(g.grp+' → '+i.ad)})});
  var h='<div class="kpis">'
   +'<div class="kpi acc" onclick="git(\'paket\')"><div class="k">Turlar</div><div class="v">'+(o.tur_sayisi||0)+'</div><div class="s">'+(o.satistaki_tur||0)+' satışta</div></div>'
   +'<div class="kpi" onclick="git(\'dosya\')"><div class="k">Açık dosya</div><div class="v">'+(o.acik_dosya||0)+'</div><div class="s">rezervasyon dosyası</div></div>'
   +'<div class="kpi w" onclick="git(\'onay\')"><div class="k">Onay bekleyen</div><div class="v">'+((o.onay_bekleyen_gorev||0)+(o.onay_bekleyen_istisna||0))+'</div><div class="s">'+(o.onay_bekleyen_gorev||0)+' görev · '+(o.onay_bekleyen_istisna||0)+' istisna</div></div>'
   +'<div class="kpi b" onclick="git(\'bulgu\')"><div class="k">Açık bulgu</div><div class="v">'+(o.acik_bulgu||0)+'</div><div class="s">denetleyici</div></div>'
   +'<div class="kpi" onclick="git(\'cari\')"><div class="k">Tedarikçi borcu</div><div class="v">'+para((o.tedarikci_borc||{}).EUR,'EUR')+'</div><div class="s">planlanan maliyet toplamı</div></div>'
   +'<div class="kpi w" onclick="git(\'gorsel\')"><div class="k">Eksik görsel</div><div class="v">'+(G&&G.eksik!=null?G.eksik:'—')+'</div><div class="s">'+(G?G.gorsel+' görsel · '+G.yer+' yer':'')+'</div></div>'
   +'<div class="kpi" onclick="git(\'kontrat\')"><div class="k">Kontrat</div><div class="v">'+(Array.isArray(K)?K.length:0)+'</div><div class="s">sezon / spot</div></div>'
   +'<div class="kpi" onclick="git(\'kurulum\')"><div class="k">Kurulum</div><div class="v">'+Math.round(kurBitti/kurTop*100)+'%</div><div class="prog"><i style="width:'+Math.round(kurBitti/kurTop*100)+'%"></i></div><div class="s">'+kurBitti+' / '+kurTop+' madde</div></div>'
   +'</div><div class="grid">'
   +'<div class="card"><h2>Onay bekleyenler</h2>'+(gorev.length?'<table>'+gorev.map(function(g){return '<tr><td><b>'+esc(g.baslik||g.gorev_tipi)+'</b><div class="small mut">'+esc(g.gorev_tipi)+'</div></td><td><span class="pill w">'+esc(g.durum)+'</span></td></tr>'}).join('')+'</table>':'<div class="small mut">Bekleyen görev yok.</div>')+'</div>'
   +'<div class="card"><h2>Açık dosyalar</h2>'+(dosyalar.length?'<table><tr><th>Dosya</th><th>Müşteri</th><th class="num">Kişi</th><th class="num">Kalan</th><th>Durum</th></tr>'+dosyalar.map(function(d){return '<tr><td><b>'+esc(d.dosya_no)+'</b><div class="small mut">'+esc(d.tur)+'</div></td><td>'+esc(d.musteri)+'</td><td class="num">'+d.kisi+'</td><td class="num">'+para(d.kalan,d.para)+'</td><td><span class="pill">'+esc(d.durum)+'</span></td></tr>'}).join('')+'</table>':'<div class="small mut">Açık dosya yok.</div>')+'</div>'
   +'<div class="card"><h2>Seçili tur · '+esc(t.kod||'')+'</h2><div class="small mut">'+esc(t.ad||'')+'</div><table><tr><td>Tarih</td><td class="num">'+tarih(t.baslangic)+' – '+tarih(t.bitis)+'</td></tr><tr><td>Kontenjan / en az</td><td class="num">'+(t.kontenjan||'—')+' / '+(t.min_kisi||'—')+'</td></tr><tr><td>Satış fiyatı</td><td class="num">'+para(t.satis_fiyati,pb)+'</td></tr><tr><td>Durum</td><td class="num"><span class="pill">'+esc(t.durum||'')+'</span></td></tr><tr><td>Son yayın</td><td class="num small">'+(yayin?esc(yayin.sonuc)+' · '+tarih(yayin.zaman):'—')+'</td></tr></table></div>'
   +'<div class="card"><h2>Henüz kurulmayanlar <span class="small mut">— soldaki "yakında" etiketli bölümler</span></h2><ul class="small" style="margin:0;padding-left:18px;line-height:1.8">'+soon.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ul></div>'
   +'</div>';
  document.getElementById('home').innerHTML=h;
}
PV.hazir.then(load);
</script>
</body>
</html>
