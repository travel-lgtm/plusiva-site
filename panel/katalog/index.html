<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Katalog · Sözlükler</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6f3;--sur:#fff;--ink:#1a1f1d;--mut:#6f7975;--line:#e3e6e2;--acc:#0f5c5a;--acc2:#e6efee;--ok:#1b5e3a;--ok2:#e8f5ec;--warn:#9a5a14;--warn2:#fff3e0;--bad:#8a2a2a;--bad2:#fbeaea}
*{box-sizing:border-box}body{margin:0;font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--sur);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:12px}header a{color:var(--acc);text-decoration:none;font-weight:700}
body.embed header{display:none}body.embed{background:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:16px 20px 40px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer;color:var(--mut)}.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--sur);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}.card h2{margin:0 0 6px;font-size:16px;font-weight:800}.card h3{margin:14px 0 6px;font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.intro{color:var(--mut);font-size:13px;line-height:1.55;margin:0 0 12px;max-width:860px}
table{width:100%;border-collapse:collapse;font-size:13.5px}th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:8px 6px;border-bottom:1px solid #eef0ee;vertical-align:top}
.tblwrap{overflow-x:auto}
.small{font-size:12px}.mut{color:var(--mut)}.num{text-align:right;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:#eeeeea;color:var(--mut);white-space:nowrap}.pill.ok{background:var(--ok2);color:var(--ok)}.pill.w{background:var(--warn2);color:var(--warn)}.pill.b{background:var(--bad2);color:var(--bad)}.pill.acc{background:var(--acc2);color:var(--acc)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11.5px;margin:1px 3px 1px 0;background:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
input,select,textarea{padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;background:#fff;color:var(--ink)}textarea{width:100%;min-height:70px;font-size:12.5px}
.btn{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink)}.btn.acc{background:var(--acc);color:#fff;border-color:var(--acc)}.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.btn.bad{color:var(--bad);border-color:#e7c9c9}
.btn:disabled{opacity:.5;cursor:default}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:10px 0}.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--mut)}.form label.ch{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-weight:600}
.kv{width:100%}.kv td:first-child{width:220px;color:var(--mut);font-weight:700;font-size:12.5px}
.set{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;background:#fff}.set:hover{border-color:var(--acc)}.set .h{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.set b{font-size:14px}
.tree .u{font-weight:800;margin-top:10px}.tree .b{margin-left:18px;font-weight:700;margin-top:6px}.tree .s{margin-left:38px;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:800px){.grid2{grid-template-columns:1fr}.kv td:first-child{width:120px}}
.msg{font-size:12.5px;color:var(--ok);font-weight:700}.msg.b{color:var(--bad)}
.agir{display:inline-block;margin:2px 6px 2px 0;font-size:12px}.agir i{font-style:normal;color:var(--acc);font-weight:800}
.empty{color:var(--mut);font-size:13px;padding:10px 0}
</style>
</head>
<body>
<header><a href="../../travel/">← Panel</a><b>Katalog · sözlükler ve kurallar</b></header>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="icerik"><div class="empty">Yükleniyor…</div></div>
</div>
<script src="../oturum.js"></script>
<script>
var SB='https://wlfabfpjvqfyvhsvldll.supabase.co', KEY='sb_publishable_eUv7jsfqkFFbn7k7l-KfAw_WhLiK3PB';
var SEK=[['urun','Ürün kartı'],['tedarik','Tedarikçiler'],['aktivite','Aktiviteler & ulaşım'],['ekurun','Ek ürünler'],['ozellik','Özellik sözlüğü'],['kural','Kural setleri'],['bolge','Yerler & bölgeler'],['takvim','Sezonlar & özel günler'],['pazar','Pazar profilleri'],['tipler','Ürün tipleri'],['vergi','Vergi kuralları'],['marka','Markalar & kanallar']];
var TIP_AD={iptal:'İptal ve iade',odeme:'Ödeme',opsiyon:'Opsiyon',cocuk:'Çocuk',oda:'Oda',katilim:'Katılım',degisiklik:'Değişiklik',kisit:'Kısıt'};
var DURUM={yururlukte:['yürürlükte','ok'],onay_bekliyor:['onay bekliyor','w'],taslak:['taslak',''],eski:['eski','']};
var NESNE_TIP=['otel','oda_tipi','arac_tipi','aktivite','restoran','gemi','kabin'];
var cur='ozellik', OZ=null, S={};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}
function tarih(d){if(!d)return '—';try{return new Date(d).toLocaleDateString('tr-TR',{day:'2-digit',month:'short',year:'numeric'})}catch(e){return d}}
function anahtar(){return (window.PV&&PV.token)?null:(localStorage.getItem('pv_anahtar')||null);}
async function rpc(fn,body){var r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+((window.PV&&PV.token)||KEY)},body:JSON.stringify(body||{})});return r.json();}
async function ki(islem,veri){return rpc('katalog_islem',{p_islem:islem,p_veri:veri||{},p_anahtar:anahtar()});}
function el(id){return document.getElementById(id);}
function tabCiz(){el('tabs').innerHTML=SEK.map(function(s){return '<span class="tab'+(s[0]===cur?' on':'')+'" onclick="ac(\''+s[0]+'\')">'+esc(s[1])+'</span>'}).join('');}
function ac(v){cur=v;tabCiz();try{var u=new URL(location.href);u.searchParams.set('v',v);history.replaceState(null,'',u)}catch(e){}CIZ[v]();}
function hata(r){return (r&&r.hata)?'<div class="card"><b>'+esc(r.hata)+'</b><div class="small mut">Giriş yapın ya da yetkinizi kontrol edin.</div></div>':'';}
function deger(x){if(x==null)return '<span class="mut">—</span>';if(typeof x==='string')return esc(x);if(typeof x==='number'||typeof x==='boolean')return esc(String(x));
  if(Array.isArray(x)){if(x.every(function(e){return typeof e!=='object'}))return x.map(function(e){return '<span class="chip">'+esc(e)+'</span>'}).join('');return x.map(function(e){return '<div style="margin-bottom:4px">'+deger(e)+'</div>'}).join('');}
  return '<table class="kv">'+Object.keys(x).map(function(k){return '<tr><td>'+esc(k.replace(/_/g,' '))+'</td><td>'+deger(x[k])+'</td></tr>'}).join('')+'</table>';}

var CIZ={};
/* ---------- Özellik sözlüğü ---------- */
CIZ.ozellik=async function(){
  var r=await ki('ozellikler');if(r.hata){el('icerik').innerHTML=hata(r);return;}S.oz=r;
  var h='<div class="card"><h2>Özellik sözlüğü</h2><p class="intro">Otel, oda, araç, aktivite, restoran ve gemi özellikleri tek listede. Her kayıtta işaretlenebilir alan olur; boş alan “yok” sayılır. <b>★</b> rakiplerin filtrelemediği ayırt edici özellik, <b>belge</b> kanıt ister, <b>anlaşma</b> otelle anlaşma yoksa filtrede hiç görünmez.</p>'
   +'<div class="bar"><input id="ozAra" placeholder="ara…" oninput="ozListe()"><select id="ozGrup" onchange="ozListe()"><option value="">tüm gruplar</option>'+r.gruplar.map(function(g){return '<option value="'+g.kod+'">'+esc(g.ad)+'</option>'}).join('')+'</select><select id="ozTip" onchange="ozListe()"><option value="">tüm kayıt tipleri</option>'+NESNE_TIP.map(function(t){return '<option>'+t+'</option>'}).join('')+'</select><span class="sp" style="flex:1"></span>'+(r.yazabilir?'<button class="btn acc" onclick="ozForm()">+ Yeni özellik</button>':'')+'</div><div id="ozForm"></div><div class="tblwrap" id="ozTbl"></div></div>';
  el('icerik').innerHTML=h;ozListe();
};
function ozListe(){var r=S.oz,q=(el('ozAra').value||'').toLowerCase(),g=el('ozGrup').value,t=el('ozTip').value;
  var gad={};r.gruplar.forEach(function(x){gad[x.kod]=x.ad});
  var L=r.ozellikler.filter(function(o){return (!q||(o.ad+' '+o.kod+' '+(o.aciklama||'')).toLowerCase().indexOf(q)>=0)&&(!g||o.grup===g)&&(!t||(o.uygulanan_tipler||[]).indexOf(t)>=0)});
  el('ozTbl').innerHTML='<div class="small mut" style="margin-bottom:6px">'+L.length+' / '+r.ozellikler.length+' özellik</div><table><tr><th>Özellik</th><th>Grup</th><th>Veri</th><th>Hangi kayıtlarda</th><th>İşaret</th><th class="num">Kullanım</th>'+(r.yazabilir?'<th></th>':'')+'</tr>'+L.map(function(o){
    return '<tr'+(o.aktif?'':' style="opacity:.5"')+'><td><b>'+esc(o.ad)+'</b>'+(o.ayirt_edici?' <span title="ayırt edici" style="color:var(--warn)">★</span>':'')+'<div class="small mut">'+esc(o.kod)+(o.aciklama?' · '+esc(o.aciklama):'')+'</div></td><td class="small">'+esc(gad[o.grup]||o.grup)+'</td><td class="small">'+esc(o.veri_tipi.replace('_',' / '))+(o.birim?' ('+esc(o.birim)+')':'')+'</td><td>'+(o.uygulanan_tipler||[]).map(function(x){return '<span class="chip">'+esc(x)+'</span>'}).join('')+'</td><td>'+(o.filtrelenebilir?'<span class="pill acc">filtre</span> ':'')+(o.belge_gerekir?'<span class="pill w">belge</span> ':'')+(o.anlasma_gerekir?'<span class="pill w">anlaşma</span>':'')+'</td><td class="num">'+o.kullanim+'</td>'+(r.yazabilir?'<td><button class="btn" onclick="ozForm(\''+o.kod+'\')">Düzenle</button></td>':'')+'</tr>'}).join('')+'</table>';}
function ozForm(kod){var r=S.oz,o=kod?r.ozellikler.find(function(x){return x.kod===kod}):{grup:el('ozGrup').value||'konum_erisim',veri_tipi:'evet_hayir',uygulanan_tipler:['otel'],filtrelenebilir:true,aktif:true,sira:99};
  el('ozForm').innerHTML='<div class="card" style="background:var(--acc2)"><b>'+(kod?'Özelliği düzenle':'Yeni özellik')+'</b><div class="form">'
   +'<label>Ad<input id="f_ad" value="'+esc(o.ad||'')+'"></label>'
   +'<label>Kod'+(kod?'':' (boş bırakılırsa addan üretilir)')+'<input id="f_kod" value="'+esc(o.kod||'')+'" '+(kod?'disabled':'')+'></label>'
   +'<label>Grup<select id="f_grup">'+r.gruplar.map(function(g){return '<option value="'+g.kod+'"'+(g.kod===o.grup?' selected':'')+'>'+esc(g.ad)+'</option>'}).join('')+'</select></label>'
   +'<label>Veri tipi<select id="f_vt">'+['evet_hayir','sayi','metin','liste','mesafe','sure'].map(function(v){return '<option'+(v===o.veri_tipi?' selected':'')+'>'+v+'</option>'}).join('')+'</select></label>'
   +'<label>Birim<input id="f_birim" value="'+esc(o.birim||'')+'" placeholder="m, dk, kişi…"></label>'
   +'<label>Sıra<input id="f_sira" type="number" value="'+(o.sira||99)+'"></label>'
   +'</div><div class="small mut" style="font-weight:700;margin-bottom:4px">Hangi kayıtlarda</div><div class="bar">'+NESNE_TIP.map(function(t){return '<label class="small"><input type="checkbox" class="f_tip" value="'+t+'"'+((o.uygulanan_tipler||[]).indexOf(t)>=0?' checked':'')+'> '+t+'</label>'}).join('')+'</div>'
   +'<div class="bar"><label class="small"><input type="checkbox" id="f_fil"'+(o.filtrelenebilir?' checked':'')+'> filtrede çıkar</label><label class="small"><input type="checkbox" id="f_ayr"'+(o.ayirt_edici?' checked':'')+'> ayırt edici ★</label><label class="small"><input type="checkbox" id="f_bel"'+(o.belge_gerekir?' checked':'')+'> belge gerekir</label><label class="small"><input type="checkbox" id="f_anl"'+(o.anlasma_gerekir?' checked':'')+'> anlaşma gerekir</label><label class="small"><input type="checkbox" id="f_akt"'+(o.aktif!==false?' checked':'')+'> aktif</label></div>'
   +'<label class="small mut" style="font-weight:700">Açıklama</label><textarea id="f_aci">'+esc(o.aciklama||'')+'</textarea>'
   +'<div class="bar" style="margin-top:8px"><button class="btn acc" onclick="ozKaydet(\''+(kod||'')+'\')">Kaydet</button><button class="btn" onclick="el(\'ozForm\').innerHTML=\'\'">Vazgeç</button><span class="msg" id="f_msg"></span></div></div>';}
async function ozKaydet(kod){var tip=[].slice.call(document.querySelectorAll('.f_tip:checked')).map(function(x){return x.value});
  var r=await ki('ozellik_kaydet',{kod:kod||el('f_kod').value,ad:el('f_ad').value,grup:el('f_grup').value,veri_tipi:el('f_vt').value,birim:el('f_birim').value,sira:el('f_sira').value,uygulanan_tipler:tip,filtrelenebilir:el('f_fil').checked,ayirt_edici:el('f_ayr').checked,belge_gerekir:el('f_bel').checked,anlasma_gerekir:el('f_anl').checked,aktif:el('f_akt').checked,aciklama:el('f_aci').value});
  if(r.hata){el('f_msg').className='msg b';el('f_msg').textContent=r.hata;return;}CIZ.ozellik();}

/* ---------- Kural setleri ---------- */
CIZ.kural=async function(sec){
  var r=await ki('kural_setleri');if(r.hata){el('icerik').innerHTML=hata(r);return;}S.ks=r;
  var tipler=Object.keys(TIP_AD);var bek=r.setler.filter(function(s){return s.durum==='onay_bekliyor'}).length;
  var h='<div class="card"><h2>Kural setleri</h2><p class="intro">İptal, ödeme, opsiyon, çocuk, oda, katılım, değişiklik ve kısıt kuralları adlı ve sürümlü setlerdir. Ürüne ya da sefere bağlı set yoksa <b>genel (varsayılan)</b> set geçerlidir. Değişiklik yeni sürüm açar; para ve iadeye dokunduğu için <b>yürürlüğe girmesi yönetici onayıyla</b> olur.'+(bek?' <span class="pill w">'+bek+' set onayınızı bekliyor</span>':'')+'</p>'
   +tipler.map(function(t){var L=r.setler.filter(function(s){return s.tip===t&&s.durum!=='eski'});var eski=r.setler.filter(function(s){return s.tip===t&&s.durum==='eski'}).length;
     return '<h3>'+esc(TIP_AD[t])+'</h3>'+(L.length?L.map(function(s){var d=DURUM[s.durum]||[s.durum,''];return '<div class="set" onclick="ksDetay(\''+s.kod+'\')"><div class="h"><b>'+esc(s.ad)+'</b><span class="small mut">'+esc(s.kod)+' · v'+s.surum+'</span><span class="pill '+d[1]+'">'+d[0]+'</span>'+(s.varsayilan?'<span class="pill acc">genel</span>':'')+(s.bag_sayisi?'<span class="pill">'+s.bag_sayisi+' bağ</span>':'')+'</div><div class="small mut" style="margin-top:4px">'+esc(s.aciklama||'')+(s.kaynak_karar?' · Kaynak: '+esc(s.kaynak_karar):'')+'</div></div>'}).join(''):'<div class="empty">Set yok.</div>')+(eski?'<div class="small mut">'+eski+' eski sürüm</div>':'');}).join('')
   +'</div>';
  el('icerik').innerHTML=h;if(sec)ksDetay(sec);
};
async function ksDetay(kod){
  var r=await ki('kural_seti',{kod:kod});S.kd=r;var s=r.surumler[0];if(!s)return;var yaz=S.ks.yazabilir,tam=S.ks.tam;
  var h='<div class="card"><div class="bar"><button class="btn" onclick="CIZ.kural()">← Tüm setler</button></div><h2>'+esc(s.ad)+' <span class="small mut">'+esc(s.kod)+'</span></h2>'
   +r.surumler.map(function(v,i){var d=DURUM[v.durum]||[v.durum,''];
     return '<div class="card" style="'+(i?'opacity:.8':'')+'"><div class="bar"><b>Sürüm '+v.surum+'</b><span class="pill '+d[1]+'">'+d[0]+'</span>'+(v.varsayilan?'<span class="pill acc">genel</span>':'')+'<span class="small mut">'+(v.onaylayan?'Onaylayan: '+esc(v.onaylayan)+' · '+tarih(v.yururluk_tarihi):'Hazırlayan: '+esc(v.hazirlayan||'—')+' · '+tarih(v.olusturuldu))+'</span></div>'
       +(v.aciklama?'<p class="small mut" style="margin:0 0 8px">'+esc(v.aciklama)+'</p>':'')+deger(v.icerik)
       +(v.durum==='onay_bekliyor'&&tam?'<div class="bar" style="margin-top:10px"><button class="btn ok" onclick="ksOnay(\''+v.kod+'\','+v.surum+')">Onayla, yürürlüğe al</button><button class="btn bad" onclick="ksRed(\''+v.kod+'\','+v.surum+')">Reddet</button></div>':'')
       +(v.durum==='onay_bekliyor'&&!tam?'<div class="small mut" style="margin-top:8px">Onay yöneticide.</div>':'')+'</div>'}).join('')
   +'<h3>Nereye bağlı</h3>'+(r.baglar.length?'<table>'+r.baglar.map(function(b){return '<tr><td>'+esc(b.nesne_tipi)+'</td><td>'+esc(b.ad)+'</td>'+(yaz?'<td class="num"><button class="btn bad" onclick="ksBagKaldir('+b.id+',\''+kod+'\')">Kaldır</button></td>':'')+'</tr>'}).join('')+'</table>':'<div class="empty">'+(s.varsayilan?'Genel set: bağ gerekmez, bağı olmayan her ürün ve seferde geçerli.':'Hiçbir yere bağlı değil.')+'</div>')
   +(yaz?'<div class="bar"><select id="bagSefer"><option value="">sefer seç…</option>'+r.seferler.map(function(x){return '<option value="'+x.id+'">'+esc(x.ad)+'</option>'}).join('')+'</select><button class="btn" onclick="ksBagla(\''+kod+'\')">Sefere bağla</button></div>':'')
   +(yaz?'<h3>Yeni sürüm hazırla</h3><p class="small mut">Değiştirmek istediğiniz satırı düzeltin; kaydedince yeni sürüm “onay bekliyor” olur, yürürlükteki sürüm onaylanana kadar geçerli kalır.</p><div id="ksForm">'+ksFormHtml(s.icerik)+'</div><div class="bar"><button class="btn acc" onclick="ksTaslak(\''+kod+'\')">Yeni sürümü onaya gönder</button><span class="msg" id="ks_msg"></span></div>':'')
   +'</div>';
  el('icerik').innerHTML=h;window.scrollTo(0,0);
}
function ksFormHtml(ic){return '<table class="kv">'+Object.keys(ic||{}).map(function(k){var v=ic[k];var t=typeof v==='string'?v:JSON.stringify(v,null,1);return '<tr><td>'+esc(k.replace(/_/g,' '))+'</td><td><textarea class="ks_alan" data-k="'+esc(k)+'" data-json="'+(typeof v==='string'?'0':'1')+'" style="min-height:'+(t.length>120?110:44)+'px">'+esc(t)+'</textarea></td></tr>'}).join('')+'</table>';}
async function ksTaslak(kod){var ic={},hataVar=null;[].slice.call(document.querySelectorAll('.ks_alan')).forEach(function(a){var k=a.getAttribute('data-k');if(a.getAttribute('data-json')==='1'){try{ic[k]=JSON.parse(a.value)}catch(e){hataVar=k}}else ic[k]=a.value;});
  if(hataVar){el('ks_msg').className='msg b';el('ks_msg').textContent='“'+hataVar+'” satırının biçimi bozuk; köşeli/süslü parantezleri koruyun.';return;}
  var r=await ki('kural_seti_taslak',{kod:kod,icerik:ic});if(r.hata){el('ks_msg').className='msg b';el('ks_msg').textContent=r.hata;return;}await CIZ.kural(kod);}
async function ksOnay(kod,s){if(!confirm(kod+' sürüm '+s+' yürürlüğe girsin mi? Önceki sürüm “eski” olur.'))return;var r=await ki('kural_seti_onayla',{kod:kod,surum:s});if(r.hata){alert(r.hata);return;}await CIZ.kural(kod);}
async function ksRed(kod,s){var n=prompt('Reddetme nedeni (kısa):','');if(n===null)return;var r=await ki('kural_seti_reddet',{kod:kod,surum:s,neden:n});if(r.hata){alert(r.hata);return;}await CIZ.kural(kod);}

  h+='<div class="card"><h2>Dahil / hariç maddeleri</h2><p class="intro">Her madde, fiyata dahil hizmet satırlarına bağlıdır; bağı olmayan madde ya da sayfada anlatılmayan dahil hizmet denetimde bulgu olur. Türkçe ve İngilizce ayrı yazılır.</p>'
   +dh.map(function(m){return m.tur==='baslik'?'<h3>'+m.tr+'</h3>':'<div style="padding:6px 0;border-bottom:1px solid #eef0ee"><div>'+m.tr+'</div><div class="small mut">'+(m.en||'<i>EN yok</i>')+'</div><div style="margin-top:3px">'+(m.bag_gerekmez?'<span class="pill">bilgi</span>':(m.bag||[]).map(function(b){return '<span class="chip">'+esc((KT_AD[b.t]||b.t)+(b.i?' · '+b.i:''))+'</span>'}).join(''))+'</div></div>'}).join('')
   +'<h3>Hariç</h3>'+hr.map(function(m){return '<div style="padding:4px 0">'+m.tr+' <span class="small mut">· '+(m.en||'')+'</span></div>'}).join('')+'</div>';
  h+='<div class="grid2"><div class="card"><h2>Kanallar</h2><table>'+(r.kanallar||[]).map(function(k){return '<tr><td><b>'+esc(k.kanal.toUpperCase())+'</b> · '+esc(k.pazar)+'</td><td>'+esc(k.marka||'—')+'</td><td>'+(k.gorunur?'<span class="pill ok">görünür</span>':'<span class="pill">kapalı</span>')+'</td><td class="small mut">'+esc(k.not||'')+'</td></tr>'}).join('')+'</table></div>'
   +'<div class="card"><h2>Ek ürünler</h2><table>'+(r.ek_urunler||[]).map(function(e){return '<tr><td>'+esc(e.ad)+'</td><td class="num">'+(e.maliyet!=null?esc(e.maliyet)+' €':'—')+'</td><td class="small">'+esc(e.kaynak||'—')+'</td><td><span class="pill">'+esc(e.durum)+'</span></td></tr>'}).join('')+'</table><div class="small mut">Satış fiyatı onaylı kaynağa bağlanmadan ek ürün satışa açılmaz.</div></div></div>';
  el('icerik').innerHTML=h;
};
async function urDenetim(id){var r=await ki('denetim_calistir',{tur_id:id});if(r.hata){el('ur_msg').className='msg b';el('ur_msg').textContent=r.hata;return;}CIZ.urun(id);}

/* ---------- Tedarikçiler ---------- */
var HIZ_AD={ucak:'uçak',sigorta:'sigorta',otel_api:'otel (API)',otobus:'otobüs',transfer:'transfer'};
CIZ.tedarik=async function(){
  var r=await ki('tedarikciler');if(r.hata){el('icerik').innerHTML=hata(r);return;}
  el('icerik').innerHTML='<div class="card"><h2>Tedarikçiler</h2><p class="intro">Hizmet tipi, bölge, durum (aday → yazışıldı → teklif → kontratlı), belgeler, kontrat ve tarife sayısı. Durumu bilinmeyenler boş bırakıldı; teyit edildikçe dolar. Banka bilgisi burada tutulmaz.</p><div class="tblwrap"><table><tr><th>Tedarikçi</th><th>Hizmet</th><th>Bölge</th><th>Durum</th><th class="num">Kontrat</th><th class="num">Tarife</th><th>Hatlar / not</th></tr>'
   +r.tedarikciler.map(function(t){return '<tr'+(t.sinif!=='gercek'?' style="opacity:.55"':'')+'><td><b>'+esc(t.ad)+'</b><div class="small mut">'+esc(t.tip)+(t.sinif!=='gercek'?' · '+esc(t.sinif):'')+(t.portal?' · '+esc(t.portal):'')+'</div></td><td>'+(t.hizmet_tipleri||[]).map(function(x){return '<span class="chip">'+esc(HIZ_AD[x]||x)+'</span>'}).join('')+'</td><td class="small">'+esc(t.bolge||'—')+'</td><td>'+(t.durum?'<span class="pill">'+esc(t.durum)+'</span>':'<span class="mut small">teyit edilecek</span>')+'</td><td class="num">'+t.kontrat+'</td><td class="num">'+t.tarife+'</td><td class="small">'+(t.hat||[]).map(esc).join(', ')+(t.kurallar&&t.kurallar.free_bilet?'<div class="mut">Free bilet: '+esc(t.kurallar.free_bilet)+'</div>':'')+'</td></tr>'}).join('')+'</table></div></div>';
};

/* ---------- Aktiviteler & ulaşım ---------- */
var YAS_AD={ADL:'Yetişkin',CHD:'Çocuk',INF:'Bebek',GENC:'Genç',YASLI:'65+/indirimli',OGRENCI:'Öğrenci',AILE:'Aile',GRUP:'Grup',REHBER:'Rehber',ENGELLI:'Engelli',UCRETSIZ:'Ücretsiz',EK:'Ek'};
CIZ.aktivite=async function(){
  var r=await ki('aktiviteler');if(r.hata){el('icerik').innerHTML=hata(r);return;}
  var h='<div class="card"><h2>Aktiviteler ve girişler</h2><p class="intro">Ücretler yalnız resmî siteden, kaynak linki ve kontrol tarihiyle girilir; "tahmin" etiketli olanlar satış fiyatına giremez (fiyat kaynağı kuralı). 2027 fiyatları henüz yayımlanmadı.</p>'
   +r.aktiviteler.map(function(a){return '<div class="card" style="margin-bottom:10px'+(a.durum!=='aktif'?';opacity:.7':'')+'"><div class="bar"><b style="font-size:15px">'+esc(a.ad)+'</b><span class="small mut">'+esc(a.kod)+' · '+esc(a.bolge||'')+'</span>'+(a.durum!=='aktif'?'<span class="pill">'+esc(a.durum)+'</span>':'')+(a.kullanim?'<span class="pill acc">'+a.kullanim+' seferde</span>':'')+(a.resmi_site?'<a class="small" href="'+esc(a.resmi_site)+'" target="_blank" rel="noopener">resmî site ↗</a>':'')+'</div>'
     +(a.ucretler.length?'<table><tr><th>Bilet</th><th>Tip</th><th>Yaş</th><th class="num">Ücret</th><th>Kaynak</th></tr>'+a.ucretler.map(function(u){return '<tr><td class="small">'+esc(u.bilet_tipi)+'</td><td>'+esc(YAS_AD[u.yas_tipi]||u.yas_tipi)+'</td><td class="small">'+esc(u.yas_araligi||'')+(u.kosul?'<div class="mut">'+esc(u.kosul)+'</div>':'')+'</td><td class="num">'+(u.tutar!=null?esc(u.tutar)+' '+esc(u.para):'—')+'</td><td><span class="pill '+(u.kaynak==='resmi'?'ok':'w')+'">'+esc(u.kaynak)+'</span>'+(u.kaynak_tarihi?' <span class="small mut">'+tarih(u.kaynak_tarihi)+'</span>':'')+(u.notlar?'<div class="small mut">'+esc(u.notlar)+'</div>':'')+'</td></tr>'}).join('')+'</table>':'')
     +(Object.keys(a.grup_kurallari||{}).length?'<div class="small" style="margin-top:6px"><b>Grup kuralı:</b> '+Object.keys(a.grup_kurallari).map(function(k){return esc(k.replace(/_/g,' '))+': '+esc(String(a.grup_kurallari[k]))}).join(' · ')+'</div>':'')
     +(a.notlar?'<div class="small mut" style="margin-top:4px">'+esc(a.notlar)+'</div>':'')+'</div>'}).join('')+'</div>';
  h+='<div class="grid2"><div class="card"><h2>Ulaşım hatları</h2><table>'+r.hatlar.map(function(x){return '<tr><td><b>'+esc(x.kalkis)+' → '+esc(x.varis)+'</b><div class="small mut">'+esc(x.kod)+(x.notlar?' · '+esc(x.notlar):'')+'</div></td><td>'+esc(x.taraf||x.tip)+'</td><td>'+(x.direkt?'<span class="pill ok">direkt</span>':'<span class="pill">aktarmalı</span>')+'</td></tr>'}).join('')+'</table></div>'
   +'<div class="card"><h2>Araç, sigorta, genel kalemler</h2><table>'+r.araclar.map(function(x){return '<tr><td>'+esc(x.ad)+'</td><td class="small mut">'+(x.yolcu_kapasitesi?x.yolcu_kapasitesi+' koltuk':'koltuk sayısı Dilim D')+'</td></tr>'}).join('')+r.sigortalar.map(function(x){return '<tr><td>'+esc(x.ad)+'</td><td class="small mut">'+esc(x.kapsam||'')+'</td></tr>'}).join('')+r.kalemler.map(function(x){return '<tr><td>'+esc(x.ad)+'</td><td class="small mut">'+esc(x.tip)+(x.birim?' · '+esc(x.birim):'')+'</td></tr>'}).join('')+'</table></div></div>';
  el('icerik').innerHTML=h;
};

  el('icerik').innerHTML='<div class="card"><h2>Ek ürünler</h2><p class="intro">Tek başına satılmayan ekstralar. Maliyeti resmî ya da yazılı kaynaktan gelmeyen ek ürün satışa açılmaz; satış fiyatı ve açılış sizin onayınızla olur.</p><div class="tblwrap"><table><tr><th>Ek ürün</th><th>Tip</th><th class="num">Maliyet</th><th>Kaynak</th><th class="num">Satış</th><th>Durum</th></tr>'
   +r.ek_urunler.map(function(e){return '<tr><td><b>'+esc(e.ad)+'</b>'+(e.notlar?'<div class="small mut">'+esc(e.notlar)+'</div>':'')+'</td><td class="small">'+esc(e.tip)+' · '+esc(e.fiyat_tipi)+'</td><td class="num">'+(e.maliyet!=null?esc(e.maliyet)+' '+esc(e.para||''):'—')+'</td><td><span class="pill '+(e.fiyat_kaynagi==='resmi'||e.fiyat_kaynagi==='kontrat'?'ok':'w')+'">'+esc(e.fiyat_kaynagi||'—')+'</span></td><td class="num">'+(e.satis_fiyati!=null?esc(e.satis_fiyati):'—')+'</td><td><span class="pill">'+esc(e.durum)+'</span></td></tr>'}).join('')+'</table></div></div>';
};
